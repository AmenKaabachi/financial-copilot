<div class="analytics-dashboard">
  <!-- Filter Bar -->
  <div class="flex flex-wrap items-end gap-3 p-4 bg-[#F7F8FA] border border-[#E7E9EE] rounded-lg mb-6">
    <!-- Date Range Filter -->
    <div class="flex flex-col gap-1">
      <label class="text-[11px] font-semibold text-[#6B7280] uppercase tracking-wider">Date Range</label>
      <div class="flex items-center gap-1.5">
        <input type="date" [(ngModel)]="dateFrom" (change)="applyFilters()" class="px-2.5 py-1.5 border border-[#E7E9EE] rounded-md text-sm text-[#0F172A] bg-white transition-all duration-200 focus:outline-none focus:border-[#2F5FE0] focus:ring-2 focus:ring-[#2F5FE0]/10 min-w-[130px]" />
        <span class="text-[#6B7280] text-xs">→</span>
        <input type="date" [(ngModel)]="dateTo" (change)="applyFilters()" class="px-2.5 py-1.5 border border-[#E7E9EE] rounded-md text-sm text-[#0F172A] bg-white transition-all duration-200 focus:outline-none focus:border-[#2F5FE0] focus:ring-2 focus:ring-[#2F5FE0]/10 min-w-[130px]" />
      </div>
    </div>

    <!-- Status Filter - COMMENTED OUT FOR NOW -->

        <option value="all">All Statuses</option>
        <option value="paid">Paid</option>

        <option value="overdue">Overdue</option>
      </select>
    </div>
    -->

    <!--
    <div class="flex flex-col gap-1">
      <label class="text-[11px] font-semibold text-[#6B7280] uppercase tracking-wider">Severity</label>
      <select [(ngModel)]="severityFilter" (change)="applyFilters()" class="px-2.5 py-1.5 border border-[#E7E9EE] rounded-md text-sm text-[#0F172A] bg-white transition-all duration-200 focus:outline-none focus:border-[#2F5FE0] focus:ring-2 focus:ring-[#2F5FE0]/10 min-w-[130px]">
        <option value="all">All Severities</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </div>
    -->

    <!-- Reset Button -->
    <button (click)="resetFilters()" class="px-3.5 py-1.5 bg-transparent text-[#6B7280] border border-[#E7E9EE] rounded-md text-sm font-medium transition-all duration-200 hover:bg-white hover:text-[#0F172A] hover:border-[#D1D5DB]">Reset</button>

    <!-- Refresh Button - Far Right -->
    <button
      (click)="loadAllData()"
      [disabled]="loading"
      class="flex items-center gap-1.5 px-3.5 py-1.5 bg-[#2F5FE0] text-white border border-[#2F5FE0] rounded-md text-sm font-medium transition-all duration-200 hover:bg-[#2450c0] hover:border-[#2450c0] disabled:opacity-50 disabled:cursor-not-allowed ml-auto"
    >
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Refresh
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading && !kpis" class="flex flex-col items-center py-12 text-[#6B7280]">
    <div class="w-8 h-8 border-3 border-[#E7E9EE] border-t-[#2F5FE0] rounded-full animate-spin mb-3"></div>
    <p class="text-sm">Loading...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="text-center py-8 px-5 bg-white border border-[#E7E9EE] rounded-lg text-[#6B7280]">
    <p class="text-sm mb-3">Something went wrong</p>
    <button (click)="loadAllData()" class="px-4.5 py-1.5 bg-[#EF4444] text-white border-none rounded-md text-sm font-medium transition-all duration-200 hover:opacity-90">Try again</button>
  </div>

  <!-- Dashboard Content -->
  <div *ngIf="!loading && !error && kpis" class="space-y-6">
    <!-- KPI Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
      <div *ngFor="let key of ['revenue', 'expenses', 'profit', 'cash_flow', 'reconciliation_rate', 'matching_accuracy', 'anomaly_stats', 'total_transactions']"
           class="flex items-center gap-3 p-3.5 bg-white border border-[#E7E9EE] rounded-lg transition-all duration-200 hover:border-[#D1D5DB] hover:shadow-sm">
        <div class="flex items-center justify-center w-10 h-10 bg-[#F7F8FA] rounded-md text-xl flex-shrink-0">
          {{ getKpiIcon(key) }}
        </div>
        <div class="flex flex-col gap-0.5 min-w-0">
          <span class="text-[11px] font-semibold text-[#6B7280] uppercase tracking-wider">{{ getKpiLabel(key) }}</span>
          <span class="text-[22px] font-bold text-[#0F172A] leading-tight" *ngIf="key === 'reconciliation_rate' || key === 'matching_accuracy'">{{ getKpiValue(key) }}%</span>
          <span class="text-[22px] font-bold text-[#0F172A] leading-tight" *ngIf="key !== 'reconciliation_rate' && key !== 'matching_accuracy'">{{ getKpiValue(key) | number:'1.0-2' }}</span>
          <span class="text-[11px] text-[#6B7280] truncate">{{ getKpiSubtext(key) }}</span>
        </div>
      </div>
    </div>

    <!-- Charts Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <!-- Chart 1: Reconciliation Trend -->
      <div class="bg-white border border-[#E7E9EE] rounded-lg p-4 pb-2 transition-all duration-200 hover:border-[#D1D5DB] hover:shadow-sm">
        <div #chartContainer class="w-full h-[280px]"></div>
      </div>
      <!-- Chart 2: Transaction Volume -->
      <div class="bg-white border border-[#E7E9EE] rounded-lg p-4 pb-2 transition-all duration-200 hover:border-[#D1D5DB] hover:shadow-sm">
        <div #chartContainer class="w-full h-[280px]"></div>
      </div>
      <!-- Chart 3: Anomaly Severity -->
      <div class="bg-white border border-[#E7E9EE] rounded-lg p-4 pb-2 transition-all duration-200 hover:border-[#D1D5DB] hover:shadow-sm">
        <div #chartContainer class="w-full h-[280px]"></div>
      </div>
      <!-- Chart 4: Anomaly Type -->
      <div class="bg-white border border-[#E7E9EE] rounded-lg p-4 pb-2 transition-all duration-200 hover:border-[#D1D5DB] hover:shadow-sm">
        <div #chartContainer class="w-full h-[280px]"></div>
      </div>
      <!-- Chart 5: Bank vs ERP -->
      <div class="bg-white border border-[#E7E9EE] rounded-lg p-4 pb-2 transition-all duration-200 hover:border-[#D1D5DB] hover:shadow-sm">
        <div #chartContainer class="w-full h-[280px]"></div>
      </div>
      <!-- Chart 6: Payment Status -->
      <div class="bg-white border border-[#E7E9EE] rounded-lg p-4 pb-2 transition-all duration-200 hover:border-[#D1D5DB] hover:shadow-sm">
        <div #chartContainer class="w-full h-[280px]"></div>
      </div>
    </div>
  </div>
</div>
