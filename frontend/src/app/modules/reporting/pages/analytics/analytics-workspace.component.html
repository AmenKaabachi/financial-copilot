<div class="analytics-dashboard">
  <!-- Filter Bar -->
  <div class="flex flex-wrap items-end gap-3 p-4 bg-[#F7F8FA] border border-[#E7E9EE] rounded-lg mb-6">
    <!-- Date Range Filter -->
    <div class="flex flex-col gap-1">
      <label class="text-[11px] font-semibold text-[#6B7280] uppercase tracking-wider">Date Range</label>
      <div class="flex items-center gap-1.5">
        <input type="date" [(ngModel)]="dateFrom" (change)="applyFilters()" class="px-2.5 py-1.5 border border-[#E7E9EE] rounded-md text-sm text-[#0F172A] bg-white transition-all duration-200 focus:outline-none focus:border-[#2F5FE0] focus:ring-2 focus:ring-[#2F5FE0]/10 min-w-[130px]" />
        <span class="text-[#6B7280] text-xs">→</span>
        <input type="date" [(ngModel)]="dateTo" (change)="applyFilters()" class="px-2.5 py-1.5 border border-[#E7E9EE] rounded-md text-sm text-[#0F172A] bg-white transition-all duration-200 focus:outline-none focus:border-[#2F5FE0] focus:ring-2 focus:ring-[#2F5FE0]/10 min-w-[130px]" />
      </div>
    </div>

    <!-- Reset Button -->
    <button (click)="resetFilters()" class="px-3.5 py-1.5 bg-transparent text-[#6B7280] border border-[#E7E9EE] rounded-md text-sm font-medium transition-all duration-200 hover:bg-white hover:text-[#0F172A] hover:border-[#D1D5DB]">Reset</button>

    <!-- Refresh Button - Far Right -->
    <button
      (click)="loadAllData()"
      [disabled]="loading"
      class="flex items-center gap-1.5 px-3.5 py-1.5 bg-[#2F5FE0] text-white border border-[#2F5FE0] rounded-md text-sm font-medium transition-all duration-200 hover:bg-[#2450c0] hover:border-[#2450c0] disabled:opacity-50 disabled:cursor-not-allowed ml-auto"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Refresh
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading && !kpis" class="flex flex-col items-center py-12 text-[#6B7280]">
    <div class="w-8 h-8 border-3 border-[#E7E9EE] border-t-[#2F5FE0] rounded-full animate-spin mb-3"></div>
    <p class="text-sm">Loading...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="text-center py-8 px-5 bg-white border border-[#E7E9EE] rounded-lg text-[#6B7280]">
    <p class="text-sm mb-3">Something went wrong</p>
    <button (click)="loadAllData()" class="px-4.5 py-1.5 bg-[#EF4444] text-white border-none rounded-md text-sm font-medium transition-all duration-200 hover:opacity-90">Try again</button>
  </div>

  <!-- Dashboard Content -->
  <div *ngIf="!error && kpis" class="space-y-6">
    <!-- KPI Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
      <div *ngFor="let key of ['revenue', 'expenses', 'profit', 'cash_flow', 'reconciliation_rate', 'matching_accuracy', 'anomaly_stats', 'total_transactions']"
           class="kpi-card flex items-center gap-3 p-3.5 bg-white border border-[#E7E9EE] rounded-lg transition-all duration-200 hover:border-[#D1D5DB] hover:shadow-sm"
           [attr.data-key]="key">
        <div class="kpi-icon-wrapper">
          <ng-container [ngSwitch]="key">
            <svg *ngSwitchCase="'revenue'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 2v4M12 22v-4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M22 12h-4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              <circle cx="12" cy="12" r="4"/>
            </svg>
            <svg *ngSwitchCase="'expenses'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 2v4M12 22v-4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M22 12h-4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              <circle cx="12" cy="12" r="4"/>
            </svg>
            <svg *ngSwitchCase="'profit'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
              <polyline points="17 6 23 6 23 12"/>
            </svg>
            <svg *ngSwitchCase="'cash_flow'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            <svg *ngSwitchCase="'reconciliation_rate'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            <svg *ngSwitchCase="'matching_accuracy'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <circle cx="12" cy="12" r="4"/>
              <line x1="12" y1="2" x2="12" y2="4"/>
              <line x1="12" y1="20" x2="12" y2="22"/>
              <line x1="2" y1="12" x2="4" y2="12"/>
              <line x1="20" y1="12" x2="22" y2="12"/>
            </svg>
            <svg *ngSwitchCase="'anomaly_stats'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <svg *ngSwitchCase="'total_transactions'" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="23 4 23 10 17 10"/>
              <polyline points="1 20 1 14 7 14"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
          </ng-container>
        </div>
        <div class="flex flex-col gap-0.5 min-w-0">
          <span class="text-[11px] font-semibold text-[#6B7280] uppercase tracking-wider">{{ getKpiLabel(key) }}</span>
          <span class="text-[22px] font-bold text-[#0F172A] leading-tight" *ngIf="key === 'reconciliation_rate' || key === 'matching_accuracy'">{{ getKpiValue(key) }}%</span>
          <span class="text-[22px] font-bold text-[#0F172A] leading-tight" *ngIf="key !== 'reconciliation_rate' && key !== 'matching_accuracy'">{{ getKpiValue(key) | number:'1.0-2' }}</span>
          <span class="text-[11px] text-[#6B7280] truncate">{{ getKpiSubtext(key) }}</span>
        </div>
      </div>
    </div>

    <!-- Charts Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <!-- Chart 1: Reconciliation Trend -->
      <div class="bg-white border border-[#E7E9EE] rounded-lg p-4 pb-2 transition-all duration-200 hover:border-[#D1D5DB] hover:shadow-sm">
        <div
          #chartContainer
          data-chart="reconciliation_trend"
          class="w-full h-[280px]">
        </div>
      </div>
      <!-- Chart 2: Transaction Volume -->
      <div class="bg-white border border-[#E7E9EE] rounded-lg p-4 pb-2 transition-all duration-200 hover:border-[#D1D5DB] hover:shadow-sm">
        <div
          #chartContainer
          data-chart="transaction_volume"
          class="w-full h-[280px]">
        </div>
      </div>
      <!-- Chart 3: Anomaly Severity -->
      <div class="bg-white border border-[#E7E9EE] rounded-lg p-4 pb-2 transition-all duration-200 hover:border-[#D1D5DB] hover:shadow-sm">
        <div
          #chartContainer
          data-chart="anomaly_distribution"
          class="w-full h-[280px]">
        </div>
      </div>
      <!-- Chart 4: Anomaly Type -->
      <div class="bg-white border border-[#E7E9EE] rounded-lg p-4 pb-2 transition-all duration-200 hover:border-[#D1D5DB] hover:shadow-sm">
        <div
          #chartContainer
          data-chart="anomaly_type"
          class="w-full h-[280px]">
        </div>
      </div>
      <!-- Chart 5: Bank vs ERP -->
      <div class="bg-white border border-[#E7E9EE] rounded-lg p-4 pb-2 transition-all duration-200 hover:border-[#D1D5DB] hover:shadow-sm">
        <div
          #chartContainer
          data-chart="bank_vs_erp"
          class="w-full h-[280px]">
        </div>
      </div>
      <!-- Chart 6: Payment Status -->
      <div class="bg-white border border-[#E7E9EE] rounded-lg p-4 pb-2 transition-all duration-200 hover:border-[#D1D5DB] hover:shadow-sm">
        <div
          #chartContainer
          data-chart="payment_status"
          class="w-full h-[280px]">
        </div>
      </div>
    </div>
  </div>
</div>
